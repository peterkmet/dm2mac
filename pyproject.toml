[project]
name = "dm2tools"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "unicorn>=2.0",
]

[project.scripts]
dm2-le = "dm2tools.le:main"
dm2-play = "dm2tools.control_client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/dm2tools"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
timeout = 120
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: tests that need network access"]
