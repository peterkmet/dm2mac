name: Linux

# Runs only for a change that can break the Linux build or the tests; a change of the docs alone does not run it.
on:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - tools/**
      - Makefile
      - pyproject.toml
      - uv.lock
      - .github/workflows/linux.yml
  pull_request:
    paths:
      - src/**
      - tests/**
      - tools/**
      - Makefile
      - pyproject.toml
      - uv.lock
      - .github/workflows/linux.yml

# A newer push to the same branch cancels the run of the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make cmake pkg-config libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev \
            libxrandr-dev libxss-dev libxtst-dev libgl1-mesa-dev
      # The key changes with this file, so a new SDL3 version or new build options build SDL3 again.
      - name: Restore SDL3
        id: sdl
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/deps/sdl
          key: sdl-${{ runner.os }}-${{ hashFiles('.github/workflows/linux.yml') }}
      - name: Build SDL3
        if: steps.sdl.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/deps
          curl -fL https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18.tar.gz \
            -o build/deps/SDL3.tar.gz
          echo '9c75cf16330322c217dedd2e0609f1124f1b54b8633e763467b4684d0f4334a3  build/deps/SDL3.tar.gz' | sha256sum -c -
          tar -xzf build/deps/SDL3.tar.gz -C build/deps
          cmake -S build/deps/SDL3-3.4.18 -B build/deps/sdl-build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/build/deps/sdl" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_WAYLAND=OFF
          cmake --build build/deps/sdl-build -j2
          cmake --install build/deps/sdl-build
      - name: Build and check
        run: |
          export SDL_PREFIX="$PWD/build/deps/sdl"
          uv sync --locked
          make -j2
          # Source-standard scans are CPU-heavy on shared runners.
          PYTEST_ADDOPTS=--timeout=600 make check
