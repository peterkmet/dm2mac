<title>Dungeon Master II Items</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one reading column; a sticky search bar with category chips; one scrollable table per category. */
:root {
  --bg: #f2f3f0; --surface: #ffffff; --fg: #1c2321; --muted: #5a6561; --line: #d6dad5;
  --accent: #2f5b86; --accent-soft: #e2eaf2;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131716; --surface: #1b201f; --fg: #e2e6e3; --muted: #95a09b; --line: #2d3432;
    --accent: #86b0dc; --accent-soft: #22303d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131716; --surface: #1b201f; --fg: #e2e6e3; --muted: #95a09b; --line: #2d3432;
  --accent: #86b0dc; --accent-soft: #22303d; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; display: grid; gap: 28px; }
header { display: grid; gap: 8px; }
h1, h2 { font-family: var(--display); font-weight: 700; letter-spacing: 0.04em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); }
h2 { font-size: 1.25rem; display: flex; align-items: baseline; gap: 10px; }
h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 16px 0 6px; }
.lede { margin: 0; color: var(--muted); max-width: 68ch; }
.count, .chip span { font: 600 0.75rem var(--mono); color: var(--muted); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.bar input { flex: 1 1 240px; min-width: 0; font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
.bar input:focus-visible, button:focus-visible, .chip:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
nav { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { text-decoration: none; color: var(--accent); background: var(--accent-soft); padding: 4px 10px; border-radius: 999px; font-weight: 600; font-size: 0.85rem; display: inline-flex; gap: 6px; align-items: baseline; }
.status { font-size: 0.85rem; color: var(--muted); }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; }
summary { cursor: pointer; font-weight: 600; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 12px 0 0; }
dt { font-weight: 600; } dd { margin: 0; color: var(--muted); }
details ul { margin: 0; padding-left: 20px; color: var(--muted); display: grid; gap: 4px; }
code { font: 0.85em var(--mono); background: var(--accent-soft); padding: 1px 4px; border-radius: 3px; }
.category { display: grid; gap: 10px; scroll-margin-top: 80px; }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th, td { padding: 7px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
tbody tr:last-child > * { border-bottom: 0; }
thead th { position: sticky; top: 0; background: var(--surface); white-space: nowrap; }
thead button { all: unset; cursor: pointer; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
thead th[aria-sort] button { color: var(--accent); }
thead th[aria-sort="ascending"] button::after { content: " ▲"; }
thead th[aria-sort="descending"] button::after { content: " ▼"; }
.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
th.name { font-weight: 600; white-space: nowrap; letter-spacing: 0.02em; }
td.actions div, td.special div { padding-block: 1px; }
td.actions { min-width: 18rem; } td.special { min-width: 14rem; color: var(--muted); }
td.actions div::before { content: "› "; color: var(--accent); }
.empty { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
<div class="wrap">
  <header>
    <h1>Dungeon Master II Items</h1>
    <p class="lede">Every item of the English PC DOS GRAPHICS.DAT, with the values and actions that the game reads. {{TOTAL}} items in six categories. Click a column name to sort.</p>
  </header>
  <div class="bar">
    <input id="filter" type="search" placeholder="Filter by name, action or effect (fireball, swing, luck…)" aria-label="Filter items">
    <nav>{{NAV}}</nav>
    <span class="status" id="status" aria-live="polite"></span>
  </div>
  <details>
    <summary>How to read the tables</summary>
    {{NOTES}}
  </details>
  {{SECTIONS}}
  <p class="empty" id="empty" hidden>No item matches the filter.</p>
</div>
<script>
(() => {
  const input = document.getElementById("filter");
  const status = document.getElementById("status");
  const empty = document.getElementById("empty");
  const rows = [...document.querySelectorAll("tbody tr")];
  rows.forEach(r => { r.dataset.text = r.textContent.toLowerCase(); });
  function apply() {
    const q = input.value.trim().toLowerCase();
    let shown = 0;
    document.querySelectorAll(".category").forEach(sec => {
      let n = 0;
      sec.querySelectorAll("tbody tr").forEach(r => {
        const hit = !q || r.dataset.text.includes(q);
        r.hidden = !hit;
        if (hit) n++;
      });
      sec.hidden = n === 0;
      shown += n;
    });
    empty.hidden = shown > 0;
    status.textContent = q ? `${shown} of ${rows.length}` : "";
    try { localStorage.setItem("dm2-items-filter", input.value); } catch (e) {}
  }
  input.addEventListener("input", apply);
  try { input.value = localStorage.getItem("dm2-items-filter") || ""; } catch (e) {}
  apply();
  document.querySelectorAll("table").forEach(table => {
    const heads = [...table.tHead.rows[0].cells];
    heads.forEach((th, col) => th.querySelector("button").addEventListener("click", () => {
      const dir = th.getAttribute("aria-sort") === "ascending" ? "descending" : "ascending";
      heads.forEach(h => h.removeAttribute("aria-sort"));
      th.setAttribute("aria-sort", dir);
      const numeric = th.classList.contains("num");
      const key = r => { const t = r.cells[col].textContent.trim(); return numeric ? (t === "" ? -1 : parseFloat(t)) : t; };
      const body = table.tBodies[0];
      [...body.rows].sort((a, b) => {
        const x = key(a), y = key(b);
        const c = numeric ? x - y : String(x).localeCompare(String(y));
        return dir === "ascending" ? c : -c;
      }).forEach(r => body.appendChild(r));
    }));
  });
})();
</script>
