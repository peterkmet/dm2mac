# DOSBox configuration for Dungeon Master II reference runs.
# Start: /Applications/dosbox.app/Contents/MacOS/DOSBox -conf tools/dosbox-dm2.conf (from the repo root)

[cpu]
cycles=20000

[sblaster]
sbtype=sb16
irq=5
dma=1
hdma=5

[autoexec]
mount c game
c:
if not exist skull.cfg setup
ibmiop skull.exe
